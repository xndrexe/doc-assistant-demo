[project]
name = "doc-assistant-demo"
version = "0.1.0"
description = "ИИ-помощник по документам: ответы по PDF, Word и тексту со ссылкой на источник"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
